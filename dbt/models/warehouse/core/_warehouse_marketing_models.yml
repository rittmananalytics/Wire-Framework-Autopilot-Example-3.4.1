version: 2

models:
  - name: fct_lead_funnel_events
    description: >
      One row per contact per funnel stage transition across Core Dynamics' 6-stage demand gen funnel:
      Subscriber → Lead → MQL → SAL → SQL → Opportunity. Includes timestamps, conversion flags,
      and days-in-stage for funnel velocity analysis. Partitioned by stage_entered_date.
    columns:
      - name: funnel_event_pk
        description: "Primary key: SHA-256(contact_pk + stage_name)"
        tests:
          - unique
          - not_null
      - name: contact_pk
        description: "Foreign key to dim_contact"
        tests:
          - not_null
          - relationships:
              to: ref('dim_contact')
              field: contact_pk
      - name: stage_name
        description: "Funnel stage: subscriber, lead, mql, sal, sql, or opportunity"
        tests:
          - not_null
          - accepted_values:
              values: [subscriber, lead, mql, sal, sql, opportunity]
      - name: stage_order
        description: "Numeric stage position (1-6)"
        tests:
          - not_null
      - name: stage_entered_ts
        description: "Timestamp when the contact entered this stage"
        tests:
          - not_null
      - name: days_in_stage
        description: "Calendar days spent in this stage before conversion (NULL if still in stage)"
      - name: is_converted
        description: "TRUE if the contact progressed to the next stage"

  - name: fct_campaign_spend
    description: >
      Daily advertising spend from Google Ads, LinkedIn Ads, and Meta Ads at campaign/ad-group level.
      Partitioned by spend_date. Used for cost-per-MQL, cost-per-SQL, and ROI calculations.
      Spend data is a daily full refresh from ad platforms — last 7 days reloaded on each run to
      capture retroactive corrections from platforms.
    columns:
      - name: spend_pk
        description: "Primary key: surrogate from platform + campaign + ad_group + date"
        tests:
          - unique
          - not_null
      - name: spend_date
        description: "Date of this spend record"
        tests:
          - not_null
      - name: platform
        description: "Ad platform"
        tests:
          - not_null
          - accepted_values:
              values: [google_ads, linkedin_ads, meta_ads]
      - name: campaign_fk
        description: "Foreign key to dim_campaign (NULL if campaign not yet in dimension)"
        tests:
          - relationships:
              to: ref('dim_campaign')
              field: campaign_pk
              config:
                severity: warn  # Platform campaigns may lag behind dim_campaign population
      - name: spend_usd
        description: "Spend in USD"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"

  - name: fct_attribution_touches
    description: >
      All marketing touches per contact from HubSpot and Outreach, normalised to a consistent
      schema. UTM-less touches are tagged channel='unattributed' and retained (not dropped).
      Outreach SDR touches are tagged channel='sdr'. Partitioned by touch_date.
    columns:
      - name: touch_pk
        description: "Primary key: surrogate from contact + timestamp + type + source"
        tests:
          - unique
          - not_null
      - name: contact_pk
        description: "Foreign key to dim_contact"
        tests:
          - not_null
          - relationships:
              to: ref('dim_contact')
              field: contact_pk
      - name: touch_ts
        description: "Timestamp of the touch event"
        tests:
          - not_null
      - name: touch_type
        description: "Type of engagement event"
        tests:
          - not_null
          - accepted_values:
              values: [page_view, form_submit, email_open, email_click, outreach_email, outreach_call, ad_click]
      - name: channel
        description: "Marketing channel: paid_search, paid_social, content, email, sdr, organic, or unattributed"
        tests:
          - not_null
          - accepted_values:
              values: [paid_search, paid_social, content, email, sdr, organic, unattributed]
      - name: is_attributed
        description: "FALSE if channel='unattributed' (missing UTMs); TRUE for all other channels"

  - name: fct_opportunity_attribution
    description: >
      Revenue and pipeline attribution for closed-won and open opportunities, allocated across all
      marketing touches within the 180-day influence window under five models: first_touch, last_touch,
      linear, time_decay (30-day half-life), and u_shaped (40/40/20 weights — default for dashboards).
      One row per opportunity × touch × attribution_model. Full table rebuild on each run.

      Key business rules:
      - 180-day influence window from opportunity creation date
      - U-shaped: 40% first touch, 40% lead conversion (SAL preferred), 20% middle touches
      - Time-decay: exponential decay with 30-day half-life from opportunity creation backwards
      - Marketing-sourced: first touch in journey is a non-SDR marketing touch
      - Marketing-influenced: at least one non-SDR touch in the 180-day window
    columns:
      - name: attribution_pk
        description: "Primary key: SHA-256(opportunity_pk + touch_pk + attribution_model)"
        tests:
          - unique
          - not_null
      - name: attribution_model
        description: "Attribution model: first_touch, last_touch, linear, time_decay, or u_shaped"
        tests:
          - not_null
          - accepted_values:
              values: [first_touch, last_touch, linear, time_decay, u_shaped]
      - name: touch_weight
        description: "Weight assigned to this touch under this model (0.0–1.0); sum per opp per model = 1.0"
        tests:
          - not_null
      - name: attributed_revenue_usd
        description: "Opportunity ARR allocated to this touch under this model"
      - name: is_marketing_sourced
        description: "TRUE if the first touch in the opportunity journey was a marketing (non-SDR) touch"
      - name: is_marketing_influenced
        description: "TRUE if at least one marketing touch occurred in the 180-day window"
      - name: is_closed_won
        description: "TRUE if the opportunity stage is Closed Won"
      - name: channel
        description: "Marketing channel of this touch"

  - name: dim_campaign
    description: >
      Campaign dimension combining campaigns from Salesforce, Google Ads, LinkedIn Ads, and Meta Ads.
      One row per unique campaign per source system. Full table rebuild on each run.
    columns:
      - name: campaign_pk
        description: "Primary key: SHA-256(source_system + source_campaign_id)"
        tests:
          - unique
          - not_null
      - name: campaign_name
        description: "Campaign name from the source system"
        tests:
          - not_null
      - name: channel
        description: "Marketing channel"
        tests:
          - not_null
          - accepted_values:
              values: [paid_search, paid_social, content, events, sdr_sequence, webinar, email, other]
      - name: source_system
        description: "Source system: salesforce, google_ads, linkedin_ads, or meta_ads"
        tests:
          - not_null

  - name: dim_contact
    description: >
      Contact dimension joining HubSpot contacts with Salesforce contacts (fuzzy-matched)
      and Clearbit firmographic enrichment. All emails stored as SHA-256 hash only — no
      plain-text PII in any column. SCD Type 1 (latest values only).
    columns:
      - name: contact_pk
        description: "Primary key: SHA-256 hash of the lowercased email"
        tests:
          - unique
          - not_null
      - name: email_pseudonymised
        description: "SHA-256 hash of the lowercased email — PII-safe. Never plain text."
        tests:
          - not_null
      - name: hubspot_lifecycle_stage
        description: "Current HubSpot lifecycle stage"
        tests:
          - accepted_values:
              values: [subscriber, lead, mql, sal, sql, opportunity, customer, evangelist, other]
              config:
                severity: warn
      - name: is_sf_matched
        description: "TRUE if this contact was successfully matched to a Salesforce contact"
      - name: match_method
        description: "Match method used: exact_email, email_hash, company_domain, or unmatched"
        tests:
          - accepted_values:
              values: [exact_email, email_hash, company_domain, unmatched]
