version: 2

sources:
  - name: staging
    database: "{{ var('marketing_project') }}"
    schema: staging
    freshness:
      warn_after: {count: 8, period: hour}
      error_after: {count: 12, period: hour}
    loaded_at_field: _fivetran_synced

    tables:
      - name: stg_salesforce__contacts
        description: "Salesforce contacts linked to accounts"

      - name: stg_salesforce__accounts
        description: "Salesforce accounts with ARR and tier"

      - name: stg_salesforce__opportunities
        description: "Salesforce opportunities with stage, ARR, and close date"

      - name: stg_salesforce__campaigns
        description: "Salesforce campaigns with budget and type"
